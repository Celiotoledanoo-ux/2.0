<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLAM POS | Punto de Venta</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Inter para lectura rápida y Playfair para el toque elegante -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Remix Icons (Íconos ligeros) -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <span class="logo-text">GLAM<span>POS</span></span>
            </div>
            <ul class="nav-links">
                <li class="active"><i class="ri- layout-grid-fill"></i></li>
                <li><i class="ri-box-3-line"></i></li>
                <li><i class="ri-history-line"></i></li>
                <li><i class="ri-settings-3-line"></i></li>
            </ul>
            <div class="user-profile">
                <div class="avatar">JS</div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="pos-content">
            <header class="top-bar">
                <div class="search-container">
                    <i class="ri-search-line"></i>
                    <input type="text" id="product-search" placeholder="Busca por nombre o SKU (F2)..." autocomplete="off">
                </div>
                <div class="stats">
                    <span class="live-clock">12:45 PM</span>
                </div>
            </header>

            <section class="catalog-grid" id="catalog-container">
                <!-- Los productos se inyectan aquí vía scrip.js -->
                <!-- Ejemplo de Skeleton Loader -->
                <div class="product-card skeleton"></div>
                <div class="product-card skeleton"></div>
                <div class="product-card skeleton"></div>
            </section>
        </main>

        <!-- Right Checkout Sidebar -->
        <aside class="checkout-panel">
            <div class="cart-header">
                <h2>Carrito Actual</h2>
                <button class="btn-clear"><i class="ri-delete-bin-line"></i></button>
            </div>
            
            <div class="cart-items" id="cart-items">
                <!-- Items de venta -->
            </div>

            <div class="summary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal-val">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>IVA (16%)</span>
                    <span id="tax-val">$0.00</span>
                </div>
                <div class="total-row">
                    <span>TOTAL</span>
                    <span id="total-val">$0.00</span>
                </div>
                <button class="btn-checkout" id="btn-pay">
                    COBRAR (F8)
                </button>
            </div>
        </aside>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
