<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Beauty POS | Sistema Integral</title>

    <!-- ESTILOS LOCALES -->
    <link rel="stylesheet" href="style.css">

    <!-- REMIX ICONS (Librería de Iconos Premium) -->
    <link href="jsdelivr.net" rel="stylesheet">

    <!-- GOOGLE FONTS (Tipografía Moderna Boutique) -->
    <link rel="preconnect" href="googleapis.com">
    <link rel="preconnect" href="gstatic.com" crossorigin>
    <link href="googleapis.com" rel="stylesheet">

    <!-- CHART.JS (Controlador de Gráficas Financieras Dinámicas) -->
    <script src="jsdelivr.net"></script>
</head>
<body>

<div id="app">

    <!-- 🔐 PANTALLA DE CONTROL DE ACCESO (LOGIN) -->
    <section id="auth-screen" class="login-container">
        <div class="login-overlay"></div>
        <div class="login-card">
            <div class="brand-logo">
                <span role="img" aria-label="lipstick">💄</span>
            </div>
            <h2>Glow Beauty</h2>
            <p class="login-subtitle">Sistema profesional POS</p>

            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <i class="ri-user-3-line"></i>
                    <input type="email" id="email" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-group">
                    <i class="ri-lock-2-line"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                <div class="input-group">
                    <i class="ri-shield-user-line"></i>
                    <select id="login-role">
                        <option value="CASHIER">Cajero (CASHIER)</option>
                        <option value="MANAGER">Gerente (MANAGER)</option>
                        <option value="ADMIN">Administrador (ADMIN)</option>
                        <option value="OWNER">Dueño (OWNER)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="ri-login-circle-line"></i> Entrar al Sistema
                </button>
            </form>
        </div>
    </section>

    <!-- 🚀 ENTORNO DEL SISTEMA PRINCIPAL -->
    <div id="main-system" class="hidden">

        <!-- BARRA SUPERIOR DE INFORMACIÓN -->
        <header class="topbar">
            <div class="header-left">
                <button id="toggleBtn" class="hamburger" aria-label="Menú">
                    <i class="ri-menu-line"></i>
                </button>
                <div class="title-area">
                    <h1>Glow Beauty POS</h1>
                    <span class="subtitle">Boutique Management System</span>
                </div>
            </div>
            <div class="header-right">
                <span id="user-display" class="user-badge"></span>
                <button id="logoutBtn" class="btn-logout" title="Cerrar Sesión">
                    <i class="ri-logout-box-r-line"></i>
                </button>
            </div>
        </header>

        <div class="container">

            <!-- PANEL DE NAVEGACIÓN LATERAL -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-top">
                    <div class="sidebar-logo">
                        <span role="img" aria-label="lips">💋</span>
                        <h2>Beauty POS</h2>
                    </div>
                </div>
                <nav class="sidebar-menu">
                    <button id="nav-pos" data-module="pos" class="active"><i class="ri-shopping-bag-3-line"></i> <span>Ventas</span></button>
                    <button id="nav-inventory" data-module="inventory"><i class="ri-store-2-line"></i> <span>Inventario</span></button>
                    <button id="nav-cash" data-module="cash"><i class="ri-safe-2-line"></i> <span>Caja</span></button>
                    <button id="nav-reports" data-module="reports"><i class="ri-bar-chart-box-line"></i> <span>Reportes</span></button>
                    <button id="nav-users" data-module="users"><i class="ri-team-line"></i> <span>Usuarios</span></button>
                </nav>
                <div class="sidebar-footer">
                    <div class="store-status">
                        <span class="status-dot"></span> Sistema Operativo
                    </div>
                </div>
            </aside>

            <!-- 🎯 CONTENEDOR MAESTRO DE RENDERIZADO DINÁMICO -->
            <main id="content-root" class="content">
                <!-- JavaScript inyectará aquí los módulos dinámicamente bajo demanda -->
            </main>

        </div>
    </div>
</div>

<!-- LÓGICA CENTRAL DEL PUNTO DE VENTA -->
<script src="script.js" type="module"></script>
</body>
</html>
