<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopper BeautyMX | POS System</title>
    <!-- Google Fonts para un look moderno -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="retail-bg">

<!-- 🔐 PANTALLA DE LOGIN (MODERNA) -->
<div id="login-screen" class="auth-wrapper">
    <div class="login-card">
        <div class="brand-header">
            <span class="logo-icon">💄</span>
            <h1>Shopper <span>BeautyMX</span></h1>
            <p>SISTEMA DE CONTROL RETAIL</p>
        </div>
        <div class="form-group">
            <label>Identificador de Acceso</label>
            <input type="text" id="login-email" placeholder="Ej: Caja 1 o admin@beauty.com">
            
            <label>Contraseña</label>
            <input type="password" id="login-pass" placeholder="••••••••">
            
            <button class="btn-primary full-width" onclick="ejecutarLogin()">INICIAR TURNO</button>
        </div>
        <div class="auth-footer">v2.0.4 | Seguridad Encriptada</div>
    </div>
</div>

<!-- 📦 SISTEMA PRINCIPAL (LAYOUT RETAIL) -->
<div id="app-shell" style="display:none;">
    
    <!-- 🔝 HEADER PROFESIONAL -->
    <header class="main-header">
        <div class="header-brand">
            <strong>Shopper</strong> BeautyMX
        </div>
        <nav class="main-nav">
            <button class="nav-item active" onclick="mostrarSeccion('venta')">🛒 VENTAS [F1]</button>
            <button class="nav-item" onclick="mostrarSeccion('inventario')">📦 STOCK [F2]</button>
            <button class="nav-item" onclick="mostrarSeccion('reportes')">📈 REPORTES [F3]</button>
        </nav>
        <div class="header-user">
            <span id="user-display-name">👤 Usuario</span>
            <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
        </div>
    </header>

    <main class="content-area">
        <!-- 🛒 SECCIÓN VENTA (ENFOCADA A VELOCIDAD) -->
        <div id="venta" class="seccion activa">
            <div class="pos-grid">
                <!-- Columna Izquierda: Buscador y Carrito -->
                <div class="pos-main">
                    <div class="search-container">
                        <input type="text" id="codigo-busqueda" placeholder="Escribe el nombre del maquillaje o escanea SKU..." oninput="buscarEnVenta()">
                        <div id="resultados-busqueda" class="dropdown-results"></div>
                    </div>
                    
                    <div class="table-card">
                        <table class="retail-table">
                            <thead>
                                <tr>
                                    <th>PRODUCTO</th>
                                    <th>PRECIO</th>
                                    <th>CANT.</th>
                                    <th>SUBTOTAL</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tabla-carrito"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Columna Derecha: Totales y Cobro -->
                <div class="pos-sidebar">
                    <div class="summary-card">
                        <h3>RESUMEN DE VENTA</h3>
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal-display">$0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>TOTAL:</span>
                            <span id="total-venta">$0.00</span>
                        </div>
                        
                        <div class="payment-method">
                            <label>Método de Pago</label>
                            <select id="metodo-pago">
                                <option value="CASH">💵 Efectivo</option>
                                <option value="CARD">💳 Tarjeta / Terminal</option>
                                <option value="TRANSFER">🏦 Transferencia</option>
                            </select>
                        </div>
                        
                        <button class="btn-pay" onclick="procesarVenta()">FINALIZAR COBRO [F10]</button>
                        <button class="btn-clear" onclick="vaciarCarrito()">Vaciar Carrito</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 📦 SECCIÓN INVENTARIO -->
        <div id="inventario" class="seccion">
            <div class="inventory-layout">
                <div class="card-form">
                    <h3>Registrar Nuevo Producto</h3>
                    <div class="form-grid">
                        <input type="text" id="inv-sku" placeholder="SKU / Código Barras">
                        <input type="text" id="inv-nombre" placeholder="Nombre (ej: Labial Mate Rojo)">
                        <input type="number" id="inv-stock" placeholder="Stock Inicial">
                        <input type="number" id="inv-precio" placeholder="Precio de Venta">
                        <button class="btn-add" onclick="crearProducto()">Guardar en Catálogo</button>
                    </div>
                </div>
                
                <div class="table-card">
                    <table id="tabla-inventario-real" class="retail-table">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>DESCRIPCIÓN</th>
                                <th>EXISTENCIA</th>
                                <th>PRECIO</th>
                                <th>ESTADO</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 📊 SECCIÓN REPORTES -->
        <div id="reportes" class="seccion">
            <div class="dashboard-grid">
                <div class="kpi-card highlight">
                    <label>Ventas de Hoy</label>
                    <div id="rep-cantidad" class="value">0</div>
                </div>
                <div class="kpi-card success">
                    <label>Ingresos Totales</label>
                    <div id="rep-ingresos" class="value">$0.00</div>
                </div>
                <div class="kpi-card warning">
                    <label>Productos con Stock Bajo</label>
                    <div id="rep-alertas" class="value">0</div>
                </div>
            </div>

            <div class="alert-box">
                <h3>🔔 Alertas de Reabastecimiento</h3>
                <ul id="lista-stock-bajo" class="clean-list"></ul>
            </div>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
