<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS Maquillaje Premium</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <button id="toggleBtn" class="hamburger">☰</button>
    <h1>Beauty POS</h1>
  </header>

  <div class="container">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <button onclick="showModule('users')">Users</button>
      <button onclick="showModule('auth')">Auth</button>
      <button onclick="showModule('inventory')">Inventory</button>
      <button onclick="showModule('sales')">Sales</button>
      <button onclick="showModule('payments')">Payments</button>
      <button onclick="showModule('reports')">Reports</button>
      <button onclick="showModule('returns')">Returns</button>
      <button onclick="showModule('cash')">Cash</button>
    </aside>

    <!-- CONTENT -->
    <main class="content">

      <section id="users" class="module active">
        <h2>Users</h2>
      </section>

      <section id="auth" class="module">
        <h2>Auth</h2>
      </section>

      <section id="inventory" class="module">
        <h2>Inventory (Maquillaje)</h2>
      </section>

      <section id="sales" class="module">
        <h2>Sales</h2>
      </section>

      <section id="payments" class="module">
        <h2>Payments</h2>
      </section>

      <section id="reports" class="module">
        <h2>Reports</h2>
      </section>

      <section id="returns" class="module">
        <h2>Returns</h2>
      </section>

      <section id="cash" class="module">
        <h2>Cash Control</h2>
      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
