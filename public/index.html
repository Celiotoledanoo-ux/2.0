<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Maquillaje | Sistema de Ventas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Pantalla de Login -->
        <section id="login-screen" class="screen">
            <div class="login-card">
                <h2>Iniciar Sesión</h2>
                <form id="login-form">
                    <input type="text" id="identifier" placeholder="Usuario o Correo" required>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <button type="submit">Entrar</button>
                </form>
            </div>
        </section>

        <!-- Dashboard Principal (Oculto al inicio) -->
        <main id="main-screen" class="screen hidden">
            <nav class="sidebar">
                <div class="logo">💄 POS Glow</div>
                <ul>
                    <li data-view="pos" class="active"><i class="ri-shopping-cart-fill"></i> Ventas</li>
                    <li data-view="inventory"><i class="ri-store-2-fill"></i> Inventario</li>
                    <li data-view="reports"><i class="ri-bar-chart-fill"></i> Reportes</li>
                    <li id="logout-btn"><i class="ri-logout-box-r-line"></i> Salir</li>
                </ul>
            </nav>

            <section class="content">
                <header>
                    <h2 id="view-title">Punto de Venta</h2>
                    <span id="user-display"></span>
                </header>
                
                <div id="view-container">
                    <!-- El contenido se carga dinámicamente aquí -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
